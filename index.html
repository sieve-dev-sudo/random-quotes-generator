<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Random Quotes</title>
  <meta name="description" content="Pull the cord on a glowing bulb to reveal a random spark of inspiration: a quote or idea to make, write, build, cook, or start.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 130'%3E%3Cpath d='M50 8 C25 8 12 26 12 46 C12 64 22 74 30 82 C36 88 36 92 36 98 L64 98 C64 92 64 88 70 82 C78 74 88 64 88 46 C88 26 75 8 50 8 Z' fill='%23F2B705'/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="rig">
  <div class="eyebrow"><span class="eyebrow-text">Random Quotes<span class="eyebrow-sep"> · </span><span class="eyebrow-line2">pull for inspiration</span></span></div>

  <div class="socket-rig">
    <div class="socket"></div>
    <div class="cord" id="cord"></div>
    <div class="pull-ring" id="pullRing" role="button" tabindex="0" aria-label="Toggle light"></div>
  </div>

  <div class="bulb-wrap" id="bulbWrap" role="button" tabindex="0" aria-label="Toggle light">
    <div class="socket-glow"></div>
    <svg id="bulb" viewBox="0 0 100 130">
      <path class="glass" d="M50 8 C25 8 12 26 12 46 C12 64 22 74 30 82 C36 88 36 92 36 98 L64 98 C64 92 64 88 70 82 C78 74 88 64 88 46 C88 26 75 8 50 8 Z"/>
      <circle class="glow-core" cx="50" cy="48" r="26" fill="url(#glowGrad)"/>
      <defs>
        <radialGradient id="glowGrad">
          <stop offset="0%" stop-color="#F2B705" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#F2B705" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path class="filament" d="M40 60 L40 40 L50 52 L60 40 L60 60"/>
      <line class="glass" x1="38" y1="98" x2="62" y2="98"/>
      <line class="glass" x1="40" y1="104" x2="60" y2="104"/>
      <line class="glass" x1="42" y1="110" x2="58" y2="110"/>
      <path class="glass" d="M42 116 Q50 122 58 116" fill="none"/>
    </svg>
    <button class="power-btn" id="powerBtn" aria-label="Toggle light" title="Toggle light">
      <svg viewBox="0 0 24 24" width="14" height="14">
        <path d="M12 2 L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="12" cy="14" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
      </svg>
    </button>
  </div>
  <div class="switch-hint">tap the bulb or switch to turn it off/on</div>

  <div class="card">
    <div class="card-label" id="cardLabel"></div>
    <div class="idea-text" id="ideaText" aria-live="polite">
      <span class="empty-state">nothing yet, give it a pull</span>
    </div>
  </div>

  <div class="pull">
    <button class="pull-btn" id="pullBtn">Pull the cord</button>
    <span class="count" id="count">0 sparks</span>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
